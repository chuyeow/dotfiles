"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
${custom.host}\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
$time\
$line_break$character"""

palette = 'soothing_ascii'

[palettes.soothing_ascii]
fg = '#d9d3ca'
muted = '#9299a3'
sage = '#d8aa7a'
moss = '#8fb8a3'
clay = '#d2a39a'
red = '#cf8f8f'
violet = '#b7a5d4'

[os]
disabled = true
style = "fg:muted"

[os.symbols]
Windows = "win"
Ubuntu = "ubuntu"
SUSE = "suse"
Raspbian = "raspi"
Mint = "mint"
Macos = "mac"
Manjaro = "manjaro"
Linux = "linux"
Gentoo = "gentoo"
Fedora = "fedora"
Alpine = "alpine"
Amazon = "amazon"
Android = "android"
AOSC = "aosc"
Arch = "arch"
Artix = "artix"
EndeavourOS = "endeavour"
CentOS = "centos"
Debian = "debian"
Redhat = "redhat"
RedHatEnterprise = "rhel"
Pop = "pop"

[custom.host]
command = 'echo mini'
when = '[[ "$(hostname -s)" == "minichu" ]]'
shell = ["bash", "--noprofile", "--norc"]
format = '[@$output](fg:sage bold)'

[username]
show_always = true
style_user = "fg:fg bold"
style_root = "fg:red bold"
format = '[$user]($style)'

[directory]
style = "fg:sage bold"
format = "[ | ](fg:muted)[$path]($style)"
truncation_length = 3
truncation_symbol = ".../"

[directory.substitutions]
"Documents" = "Docs"
"Downloads" = "Down"
"Music" = "Music"
"Pictures" = "Pics"
"Developer" = "Dev"

[git_branch]
symbol = "git:"
style = "fg:moss"
format = '[ | ](fg:muted)[$symbol$branch]($style)'

[git_status]
style = "fg:clay"
format = '([ $all_status$ahead_behind]($style))'

[nodejs]
symbol = "node:"
style = "fg:clay"
format = '[ | ](fg:muted)[$symbol$version]($style)'

[c]
symbol = "c:"
style = "fg:clay"
format = '[ | ](fg:muted)[$symbol$version]($style)'

[cpp]
symbol = "cpp:"
style = "fg:clay"
format = '[ | ](fg:muted)[$symbol$version]($style)'

[rust]
symbol = "rs:"
style = "fg:clay"
format = '[ | ](fg:muted)[$symbol$version]($style)'

[golang]
symbol = "go:"
style = "fg:clay"
format = '[ | ](fg:muted)[$symbol$version]($style)'

[php]
symbol = "php:"
style = "fg:clay"
format = '[ | ](fg:muted)[$symbol$version]($style)'

[java]
symbol = "java:"
style = "fg:clay"
format = '[ | ](fg:muted)[$symbol$version]($style)'

[kotlin]
symbol = "kt:"
style = "fg:clay"
format = '[ | ](fg:muted)[$symbol$version]($style)'

[haskell]
symbol = "hs:"
style = "fg:clay"
format = '[ | ](fg:muted)[$symbol$version]($style)'

[python]
symbol = "py:"
style = "fg:clay"
format = '[ | ](fg:muted)[$symbol$version]($style)'

[docker_context]
symbol = "docker:"
style = "fg:violet"
format = '[ | ](fg:muted)[$symbol$context]($style)'

[conda]
symbol = "conda:"
style = "fg:violet"
format = '[ | ](fg:muted)[$symbol$environment]($style)'

[pixi]
symbol = "pixi:"
style = "fg:violet"
format = '[ | ](fg:muted)[$symbol$version( $environment)]($style)'

[time]
disabled = false
time_format = "%R"
style = "fg:muted"
format = '[ | ](fg:muted)[$time]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[>](bold fg:moss)'
error_symbol = '[>](bold fg:red)'
vimcmd_symbol = '[<](bold fg:moss)'
vimcmd_replace_one_symbol = '[<](bold fg:violet)'
vimcmd_replace_symbol = '[<](bold fg:violet)'
vimcmd_visual_symbol = '[<](bold fg:clay)'
